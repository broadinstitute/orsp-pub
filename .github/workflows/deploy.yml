name: Build and deploy to GKE

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: string
      project_id:
        description: 'Google Cloud Project ID'
        required: true
        type: string
      cluster:
        description: 'GKE Cluster Name'
        required: true
        type: string
      cluster_region:
        description: 'GKE Cluster Region'
        required: true
        type: string
      artifact_registry:
        description: 'Artifact Registry Name'
        required: true
        type: string
      registry_region:
        description: 'Artifact Registry Region'
        required: true
        type: string
      deployment:
        description: 'Kubernetes Deployment Name'
        required: true
        type: string
      image:
        description: 'Docker Image Name'
        required: true
        type: string
      project_number:
        description: 'Google Cloud Project Number'
        required: true
        type: string
      service_account:
        description: 'Google Cloud Service Account Email'
        required: true
        type: string
      workloadIdentityPools:
        description: 'name of workloadIdentityPools Google Cloud Project'
        required: true
        type: string

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using Workload Identity
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ inputs.project_number }}/locations/global/workloadIdentityPools/${{ inputs.workloadIdentityPools }}/providers/github
          service_account: ${{ inputs.service_account }}
          token_format: access_token

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Login to Artifact Registry
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry_region }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Generate image tag using commit SHA
      - name: Generate Image Tag
        run: |
          TAG=${GITHUB_SHA::7}
          IMAGE_URI=${{ inputs.registry_region }}-docker.pkg.dev/${{ inputs.project_id }}/${{ inputs.artifact_registry }}/${{ inputs.image }}:$TAG
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_URI }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Get credentials for GKE
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ inputs.cluster }}
          location: ${{ inputs.cluster_region }}

      # Deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          set -e
          kubectl set image deployment/${{ inputs.deployment }} orsp-pub=$IMAGE_URI -n orsp
          kubectl set env deployment/${{ inputs.deployment }} GRAILS_ENV=${{ inputs.environment }} -n orsp
          kubectl rollout status deployment/${{ inputs.deployment }} -n orsp --timeout=10m
          kubectl get pods -n orsp
          kubectl describe deployment ${{ inputs.deployment }} -n orsp
